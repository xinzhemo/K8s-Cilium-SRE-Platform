apiVersion: v1
kind: Pod
metadata:
  name: probe-domain
  namespace: default
  labels:
    app: probe-domain
spec:
  restartPolicy: Never
  containers:
  - name: probe
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      while true; do
        if wget -q -O- --timeout=2 http://nginx-svc.default.svc.cluster.local >/dev/null 2>&1; then
          echo "$(date +%s) DOMAIN OK"
        else
          echo "$(date +%s) DOMAIN FAIL"
        fi
        sleep 5
      done
