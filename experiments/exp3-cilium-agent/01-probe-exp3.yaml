apiVersion: v1
kind: Pod
metadata:
  name: probe-exp3
  namespace: default
  labels:
    app: probe-exp3
spec:
  restartPolicy: Never
  containers:
  - name: probe
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      while true; do
        if wget -q -O- --timeout=2 http://nginx-svc.default.svc.cluster.local >/dev/null 2>&1; then
          echo "$(date +%s) OK"
        else
          echo "$(date +%s) FAIL"
        fi
        sleep 2
      done
